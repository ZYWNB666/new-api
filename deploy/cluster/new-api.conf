; ============================================================================
; new-api supervisord 配置（slave 节点）
; ============================================================================
; 与 master 的 /etc/supervisor/conf.d/new-api.conf 保持一致：
;   - startsecs=15       给足初始化和数据库迁移检查时间
;   - stopwaitsecs=180   匹配应用默认 120s 排空窗口
;   - stopasgroup/killasgroup  保证信号能传到整个进程组
; 差异：无。集群内所有节点使用同一份进程托管策略，仅 env 区分角色。
; ============================================================================

[program:new-api]
command=/opt/new-api/start.sh
directory=/opt/new-api
user=newapi
autostart=true
autorestart=true
startsecs=15
startretries=5
stopwaitsecs=180
stopsignal=TERM
killasgroup=true
stopasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/new-api/supervisor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
