; ============================================================================
; new-api supervisord 配置
; ============================================================================
; 使用方式：
;   1. 复制本文件到 /etc/supervisor/conf.d/new-api.conf
;   2. 复制 new-api.env.example 为 /usr/local/new-api/.env 并填写变量
;   3. sudo mkdir -p /var/log/new-api && sudo chown www-data:www-data /var/log/new-api
;   4. sudo supervisorctl reread && sudo supervisorctl update
;   5. sudo supervisorctl start new-api
;
; 查看日志：sudo supervisorctl tail -f new-api
;           或 tail -f /var/log/new-api/app.log
; ============================================================================

[program:new-api]
; ---- 启动命令 ----
; new-api 会自动读取工作目录下的 .env 文件（godotenv.Load(".env")）
; 前端已嵌入二进制（go:embed web/dist），单进程即可，无需单独跑前端
command=/usr/local/new-api/new-api --port 3000 --log-dir /var/log/new-api

; ---- 工作目录 ----
; .env 文件放在此目录，程序启动时自动加载
directory=/usr/local/new-api

; ---- 进程管理 ----
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true

; ---- 日志 ----
stdout_logfile=/var/log/new-api/app.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/new-api/error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

; ---- 运行用户 ----
user=www-data
group=www-data
